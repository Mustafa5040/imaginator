                             margin: 0;
                             padding: 0; 
                             min-height: 100dvh; 
                             user-select: none;">
  <div id="start-menu" class="window" style="display: none; position: absolute; bottom: 30px; left: 2px; z-index: 10000; width: 180px;">
  <div style="display: flex;">
    <div style="background: navy; width: 24px; writing-mode: vertical-rl; transform: rotate(180deg); color: white; font-weight: bold; padding: 4px; font-size: 14px;">
      Windows<b>98</b>
    </div>
    <ul role="menu" style="flex: 1; margin: 0; padding: 2px;">
      <li role="menuitem" tabindex="0" id="sm-imaginator">Imaginator</li>
      <li role="menuitem" tabindex="0" id="sm-info">Info</li>
    </ul>
  </div>
</div>
  <header id="taskbar" style="background: #c0c0c0;
                    border-top: 2px solid #fff;
                    border-left: 2px solid #fff;
                    border-right: 2px solid #808080;
                    border-bottom: 2px solid #808080;
                    width: 100%;
                    z-index: 999;
                    box-sizing: border-box;
                    display: flex;
                    position: absolute;
                    bottom: 0;
                    align-items: center;
                    user-select: none;
                    gap: 6px;
                    padding: 2px 4px;">

    <button id="startbtn" style="padding: 0; margin: 0; cursor: pointer;" class="default">
      <img src="resources/start9x.png" style="width: 16px; height: 16px; pointer-events: none; user-select: none; vertical-align: middle;" />
      <label style="font-size:small; vertical-align: middle; font-weight: bold;"> Start</label>
    </button>
    <div id="taskbar-pinned-apps" style="display: flex; gap: 4px; flex: none; overflow-x: auto; align-items: center;">
    </div>
    <div id="taskbar-apps" style="display: flex; gap: 4px; flex: 1; overflow-x: auto; align-items: center;">
    </div>
    <div id="tray" class="status-bar-field" style="margin: 0; padding: 2px 8px; flex: none;">
  <span id="clock_tray">17.13</span>
</div>
</header>
  

  <script type="module" src="./js/entry.js"></script>
